<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bilgi Sistemi</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bilgi Sistemi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<!--
  Bağlantısız, noindex sayfa (bkz. .htaccess/robots notları). Veri hiç ağa
  gitmez: CSV/Excel dosyası cihazda parça parça (streaming) okunur ve
  IndexedDB'ye yazılır; hiçbir satır sunucuya veya başka bir yere
  gönderilmez. Büyük dosyalarda (onlarca MB) tek seferde belleğe almak
  yerine 4MB'lık parçalar halinde okunup satır satır işlenir — önceki
  sürüm (SheetJS + tüm dosyayı tek seferde parse) büyük CSV'lerde iOS
  Safari'yi bellek yetersizliğinden çökertiyordu.
-->
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#111214; --surface-2:#17181b; --line:#242528;
  --text-1:#f3f1ec; --text-2:#9a9fa8; --text-3:#5b6069;
  --accent:#c9a04a; --bad:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:36px 20px 60px}
.brand{text-align:center;margin-bottom:28px}
.brand img{width:64px;height:64px;display:block;margin:0 auto 14px;object-fit:contain}
.brand h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:30px;margin:0 0 6px}
.brand p{color:var(--text-2);font-style:italic;font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card label{display:block;font-size:11px;letter-spacing:.08em;color:var(--text-2);margin-bottom:10px}
.search-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:14px}
.search-row svg{flex:none;opacity:.6}
.search-row input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text-1);font:inherit}
.search-row input::placeholder{color:var(--text-3)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:10px;font:inherit;font-weight:600;
  cursor:pointer;text-align:center;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){background:rgba(201,160,74,.12)}
.hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.upload-link{display:inline-flex;align-items:center;gap:8px;color:var(--accent);background:none;border:none;
  font:inherit;font-weight:600;cursor:pointer;padding:0}
.count{color:var(--text-2)}
.progress-wrap{margin-top:14px;display:none}
.progress-wrap.show{display:block}
.progress-bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress-bar>div{height:100%;background:var(--accent);width:0%;transition:width .15s linear}
.progress-label{margin-top:8px;font-size:12.5px;color:var(--text-2);text-align:center}
.msg{font-size:13px;margin-top:10px;color:var(--text-2)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.rtable{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
table.rtable th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--text-2);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.rtable td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--text-1)}
table.rtable tbody tr:last-child td{border-bottom:none}
table.rtable tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
table.rtable tbody tr{cursor:pointer}
table.rtable tbody tr:active td{background:rgba(201,160,74,.08)}
.detail-row td{white-space:normal;background:var(--surface-2) !important;cursor:default;padding:12px 14px}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.detail-grid dt{color:var(--text-2);white-space:nowrap}
.detail-grid dd{margin:0;color:var(--text-1);word-break:break-word}
.hint{color:var(--text-3);font-size:13px;text-align:center;padding:18px 0}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="icon.png" alt="">
    <h1>Bilgi Sistemi</h1>
    <p>Personel Bilgi ve Arama Sistemi</p>
  </div>

  <div class="card">
    <label id="searchLabel">TC, AD SOYAD VEYA TELEFON</label>
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="q" type="search" inputmode="search" placeholder="TC, ad soyad veya telefon" autocomplete="off">
    </div>
    <button class="btn" id="searchBtn">Sorgula</button>

    <hr class="hr">
    <div class="row-between">
      <button class="upload-link" id="uploadLink">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"></path></svg>
        Excel / CSV yükle
      </button>
      <span class="count" id="countLabel">0 personel</span>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv,.txt">

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">İşleniyor...</div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
(function(){
  "use strict";

  var DB_NAME = 'bilgi-sistemi-v2';
  var DB_VERSION = 1;
  var STORE = 'records';
  var META = 'meta';
  var BATCH_SIZE = 2000;
  var CHUNK_BYTES = 4 * 1024 * 1024;
  var MAX_RESULTS = 50;

  var els = {
    q: document.getElementById('q'),
    searchBtn: document.getElementById('searchBtn'),
    uploadLink: document.getElementById('uploadLink'),
    fileInput: document.getElementById('fileInput'),
    countLabel: document.getElementById('countLabel'),
    progressWrap: document.getElementById('progressWrap'),
    progressBar: document.getElementById('progressBar'),
    progressLabel: document.getElementById('progressLabel'),
    msg: document.getElementById('msg'),
    results: document.getElementById('results'),
    searchLabel: document.getElementById('searchLabel')
  };

  var memRecords = [];   // [{c:[cell,...], s:'lowercased joined cells'}]
  var headers = [];
  var cols = { tc: -1, name: -1, phone: -1 };
  var db = null;

  // CSV'de "şirket çalışanlarının hepsi" gibi onlarca sütun olsa da, sonuçlarda
  // sadece bu 3 alan gösterilir — arama yine tüm hücrelerde yapılır.
  var ALIASES = {
    tc: ['tc', 'tckn', 'tcno', 'tckimlikno', 'tckimliknumarasi', 'kimlikno'],
    name: ['adsoyad', 'adisoyadi', 'adsoyadi', 'isim', 'ad', 'adi', 'personel', 'personeladi'],
    surname: ['soyad', 'soyadi', 'soyisim'],
    phone: ['telefon', 'tel', 'tlf', 'gsm', 'ceptelefonu', 'cepno', 'cep', 'telefonno']
  };

  function normalizeHeader(h){
    // Türkçe İ/I/ı/i tutarsızlığı (kaynak CSV'ler genelde ASCII I/i kullanıyor):
    // eşleştirme için ı'yı i'ye katla, böylece "ADI"/"Adı" ikisi de "adi" olur.
    return trLower(String(h || '')).replace(/ı/g, 'i').replace(/[^a-z0-9]/g, '');
  }

  function detectColumns(hdrs){
    var out = { tc: -1, name: -1, surname: -1, phone: -1 };
    hdrs.forEach(function(h, i){
      var n = normalizeHeader(h);
      Object.keys(ALIASES).forEach(function(key){
        if (out[key] === -1 && ALIASES[key].indexOf(n) !== -1) out[key] = i;
      });
    });
    // Bilinen başlık yoksa (düzensiz CSV), ilk üç sütunu sırayla varsay.
    if (out.tc === -1 && out.name === -1 && out.phone === -1 && hdrs.length) {
      out.tc = 0; out.name = Math.min(1, hdrs.length - 1); out.phone = Math.min(2, hdrs.length - 1);
    }
    return out;
  }

  function displayName(rec){
    var first = cols.name >= 0 ? (rec.c[cols.name] || '') : '';
    var last = cols.surname >= 0 ? (rec.c[cols.surname] || '') : '';
    return (first + ' ' + last).trim();
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  function setMsg(text, kind){
    els.msg.textContent = text || '';
    els.msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function openDb(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) {
          d.createObjectStore(STORE, { autoIncrement: true });
        }
        if (!d.objectStoreNames.contains(META)) {
          d.createObjectStore(META);
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbClear(){
    return new Promise(function(resolve, reject){
      var tx = db.transaction([STORE, META], 'readwrite');
      tx.objectStore(STORE).clear();
      tx.objectStore(META).clear();
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbPutMeta(key, val){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(META, 'readwrite');
      tx.objectStore(META).put(val, key);
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbGetMeta(key){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(META, 'readonly');
      var req = tx.objectStore(META).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbAddBatch(rows){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readwrite');
      var store = tx.objectStore(STORE);
      for (var i = 0; i < rows.length; i++) store.add(rows[i]);
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbLoadAll(){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readonly');
      var req = tx.objectStore(STORE).getAll();
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  function trLower(s){
    try { return s.toLocaleLowerCase('tr'); } catch(e) { return s.toLowerCase(); }
  }

  function updateCount(){
    els.countLabel.textContent = memRecords.length.toLocaleString('tr') + ' personel';
  }

  // ---- CSV parsing (quote-aware, single line) ----
  function splitCsvLine(line, delim){
    var cells = [];
    var cur = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i+1] === '"') { cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === delim) { cells.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    cells.push(cur);
    return cells;
  }

  function detectDelimiter(headerLine){
    var commas = (headerLine.match(/,/g) || []).length;
    var semis = (headerLine.match(/;/g) || []).length;
    return semis > commas ? ';' : ',';
  }

  // ---- Import flow ----
  function startImport(file){
    setMsg('');
    els.progressWrap.classList.add('show');
    els.searchBtn.disabled = true;
    els.uploadLink.style.pointerEvents = 'none';

    var decoder = new TextDecoder('utf-8');
    var offset = 0;
    var carry = '';
    var delim = null;
    var gotHeader = false;
    var pendingBatch = [];
    var totalParsed = 0;
    var size = file.size;

    function flushBatch(){
      if (!pendingBatch.length) return Promise.resolve();
      var batch = pendingBatch;
      pendingBatch = [];
      memRecords = memRecords.concat(batch);
      return idbAddBatch(batch);
    }

    function processLine(line){
      if (line === '') return;
      if (!gotHeader) {
        delim = detectDelimiter(line);
        headers = splitCsvLine(line, delim).map(function(h){ return h.trim(); });
        gotHeader = true;
        return;
      }
      var cells = splitCsvLine(line, delim);
      var joined = trLower(cells.join(' ␟ '));
      var rec = { c: cells, s: joined };
      pendingBatch.push(rec);
      totalParsed++;
    }

    function processChunkText(text, isLast){
      carry += text;
      var lines = carry.split(/\r\n|\n|\r/);
      carry = isLast ? '' : lines.pop();
      for (var i = 0; i < lines.length; i++) processLine(lines[i]);
      if (isLast && carry) { processLine(carry); carry = ''; }
    }

    function readNext(){
      if (offset >= size) return finish();
      var slice = file.slice(offset, offset + CHUNK_BYTES);
      var reader = new FileReader();
      reader.onload = function(e){
        offset += CHUNK_BYTES;
        var isLast = offset >= size;
        var text = decoder.decode(e.target.result, { stream: !isLast });
        processChunkText(text, isLast);

        var pct = Math.min(100, Math.round((offset / size) * 100));
        els.progressBar.style.width = pct + '%';
        els.progressLabel.textContent = pct + '% · ' + totalParsed.toLocaleString('tr') + ' satır işlendi';

        var go = function(){ isLast ? finish() : readNext(); };
        if (pendingBatch.length >= BATCH_SIZE) {
          flushBatch().then(function(){
            // yield to the UI thread so iOS doesn't treat this as unresponsive
            setTimeout(go, 0);
          }).catch(function(err){ fail(err); });
        } else {
          setTimeout(go, 0);
        }
      };
      reader.onerror = function(){ fail(reader.error); };
      reader.readAsArrayBuffer(slice);
    }

    function finish(){
      flushBatch().then(function(){
        return idbPutMeta('headers', headers);
      }).then(function(){
        els.progressWrap.classList.remove('show');
        els.searchBtn.disabled = false;
        els.uploadLink.style.pointerEvents = '';
        updateCount();
        updateSearchLabel();
        setMsg(totalParsed.toLocaleString('tr') + ' kayıt yüklendi.', 'ok');
      }).catch(fail);
    }

    function fail(err){
      els.progressWrap.classList.remove('show');
      els.searchBtn.disabled = false;
      els.uploadLink.style.pointerEvents = '';
      setMsg('Hata: ' + (err && err.message ? err.message : err), 'err');
    }

    idbClear().then(function(){
      memRecords = [];
      headers = [];
      readNext();
    }).catch(fail);
  }

  function updateSearchLabel(){
    cols = detectColumns(headers || []);
    els.searchLabel.textContent = 'TC, AD SOYAD VEYA TELEFON';
  }

  function toggleDetail(tr, rec){
    var next = tr.nextElementSibling;
    if (next && next.classList.contains('detail-row')) {
      next.remove();
      return;
    }
    var old = tr.parentNode.querySelector('.detail-row');
    if (old) old.remove();

    var detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    var td = document.createElement('td');
    td.colSpan = 3;
    var dl = document.createElement('dl');
    dl.className = 'detail-grid';
    (headers.length ? headers : rec.c.map(function(_, i){ return 'Alan ' + (i + 1); })).forEach(function(h, i){
      var val = rec.c[i];
      if (!val) return;
      var dt = document.createElement('dt'); dt.textContent = h;
      var dd = document.createElement('dd'); dd.textContent = val;
      dl.appendChild(dt); dl.appendChild(dd);
    });
    td.appendChild(dl);
    detailTr.appendChild(td);
    tr.parentNode.insertBefore(detailTr, tr.nextSibling);
  }

  // ---- Search ----
  function doSearch(){
    var raw = els.q.value.trim();
    els.results.innerHTML = '';
    if (!raw) return;
    var query = trLower(raw);
    var digits = raw.replace(/\s+/g, '');
    var isDigitQuery = /^\d+$/.test(digits);

    var matches = [];
    for (var i = 0; i < memRecords.length && matches.length < 5000; i++) {
      var rec = memRecords[i];
      var hit = rec.s.indexOf(query) !== -1;
      if (!hit && isDigitQuery) {
        for (var j = 0; j < rec.c.length; j++) {
          if (rec.c[j].replace(/\s+/g, '') === digits) { hit = true; break; }
        }
      }
      if (hit) matches.push(rec);
    }

    if (!matches.length) {
      els.results.innerHTML = '<div class="hint">Eşleşme bulunamadı.</div>';
      return;
    }

    var shown = matches.slice(0, MAX_RESULTS);
    var wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    var table = document.createElement('table');
    table.className = 'rtable';
    var theadRow = document.createElement('tr');
    ['TC Kimlik No', 'Ad Soyad', 'Telefon'].forEach(function(h){
      var th = document.createElement('th'); th.textContent = h; theadRow.appendChild(th);
    });
    var thead = document.createElement('thead');
    thead.appendChild(theadRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    shown.forEach(function(rec){
      var tr = document.createElement('tr');
      [cols.tc >= 0 ? rec.c[cols.tc] : '', displayName(rec), cols.phone >= 0 ? rec.c[cols.phone] : '']
        .forEach(function(val){
          var td = document.createElement('td'); td.textContent = val || '-'; tr.appendChild(td);
        });
      tr.addEventListener('click', function(){ toggleDetail(tr, rec); });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    els.results.appendChild(wrap);

    if (matches.length > MAX_RESULTS) {
      var more = document.createElement('div');
      more.className = 'hint';
      more.textContent = 'İlk ' + MAX_RESULTS + ' / ' + matches.length.toLocaleString('tr') + ' eşleşme';
      els.results.appendChild(more);
    }
  }

  els.searchBtn.addEventListener('click', doSearch);
  els.q.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(); });
  els.uploadLink.addEventListener('click', function(){ els.fileInput.click(); });
  els.fileInput.addEventListener('change', function(){
    var f = els.fileInput.files && els.fileInput.files[0];
    els.fileInput.value = '';
    if (f) startImport(f);
  });

  els.searchBtn.disabled = true;
  els.uploadLink.style.pointerEvents = 'none';
  setMsg('Kayıtlı veriler yükleniyor...');

  openDb().then(function(d){
    db = d;
    return Promise.all([idbLoadAll(), idbGetMeta('headers')]);
  }).then(function(res){
    var rows = res[0];
    headers = res[1] || [];
    memRecords = rows;
    updateCount();
    updateSearchLabel();
    setMsg('');
  }).catch(function(err){
    setMsg('Veritabanı açılamadı: ' + (err && err.message ? err.message : err), 'err');
  }).then(function(){
    els.searchBtn.disabled = false;
    els.uploadLink.style.pointerEvents = '';
  });
})();
</script>
</body>
</html>
