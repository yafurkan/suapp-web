<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Bilgi Sistemi</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bilgi Sistemi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<!--
  Bağlantısız, noindex sayfa (bkz. .htaccess/robots notları). Veri hiç ağa
  gitmez: CSV/Excel dosyası cihazda parça parça (streaming) okunur ve
  IndexedDB'ye yazılır; hiçbir satır sunucuya veya başka bir yere
  gönderilmez. Büyük dosyalarda (onlarca MB) tek seferde belleğe almak
  yerine 4MB'lık parçalar halinde okunup satır satır işlenir — önceki
  sürüm (SheetJS + tüm dosyayı tek seferde parse) büyük CSV'lerde iOS
  Safari'yi bellek yetersizliğinden çökertiyordu.
-->
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --surface:#111214; --surface-2:#17181b; --line:#242528;
  --text-1:#f3f1ec; --text-2:#9a9fa8; --text-3:#5b6069;
  --accent:#c9a04a; --bad:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:36px 20px 60px}
.brand{text-align:center;margin-bottom:28px}
.brand img{width:64px;height:64px;display:block;margin:0 auto 14px;object-fit:contain}
.brand h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:30px;margin:0 0 6px}
.brand p{color:var(--text-2);font-style:italic;font-size:14px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.card label{display:block;font-size:11px;letter-spacing:.08em;color:var(--text-2);margin-bottom:10px}
.search-row{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:13px 14px;margin-bottom:14px}
.search-row svg{flex:none;opacity:.6}
.search-row input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text-1);font:inherit}
.search-row input::placeholder{color:var(--text-3)}
.btn{display:block;width:100%;padding:13px 14px;border-radius:10px;font:inherit;font-weight:600;
  cursor:pointer;text-align:center;border:1.5px solid var(--accent);background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:active:not(:disabled){background:rgba(201,160,74,.12)}
.btn.ghost{border-color:var(--line);color:var(--text-2);font-weight:600}
.btn.ghost:active:not(:disabled){background:rgba(255,255,255,.04)}
.scan-wrap{margin-top:10px}
.scan-text{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
  font-size:12.5px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);
  background:rgba(201,160,74,.08);font:inherit;font-size:13px;cursor:pointer}
.hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.upload-link{display:inline-flex;align-items:center;gap:8px;color:var(--accent);background:none;border:none;
  font:inherit;font-weight:600;cursor:pointer;padding:0}
.count{color:var(--text-2)}
.progress-wrap{margin-top:14px;display:none}
.progress-wrap.show{display:block}
.progress-bar{height:6px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress-bar>div{height:100%;background:var(--accent);width:0%;transition:width .15s linear}
.progress-label{margin-top:8px;font-size:12.5px;color:var(--text-2);text-align:center}
.msg{font-size:13px;margin-top:10px;color:var(--text-2)}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.results{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.rtable{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
table.rtable th{text-align:left;font-size:11px;letter-spacing:.06em;color:var(--text-2);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.rtable td{padding:11px 14px;border-bottom:1px solid var(--line);color:var(--text-1)}
table.rtable tbody tr:last-child td{border-bottom:none}
table.rtable tbody tr:nth-child(even) td{background:rgba(255,255,255,.015)}
table.rtable tbody tr{cursor:pointer}
table.rtable tbody tr:active td{background:rgba(201,160,74,.08)}
.detail-row td{white-space:normal;background:var(--surface-2) !important;cursor:default;padding:12px 14px}
tr.group-row td{background:rgba(201,160,74,.1) !important;color:var(--accent);font-size:12px;
  font-weight:600;padding:8px 14px;cursor:default;border-left:2px solid var(--accent)}
tr.grouped td{border-left:2px solid var(--line)}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;align-items:center}
.detail-grid dt{color:var(--text-2);white-space:nowrap}
.detail-grid dd{margin:0;color:var(--text-1);word-break:break-word}
.detail-input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:#0e0f13;color:var(--text-1);font:inherit;font-size:13px}
.detail-actions{display:flex;gap:8px;margin-top:14px}
.detail-btn{flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:none;
  color:var(--text-2);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.detail-btn.accent{border-color:var(--accent);color:var(--accent)}
.detail-btn.danger{border-color:var(--bad);color:var(--bad)}
.hint{color:var(--text-3);font-size:13px;text-align:center;padding:18px 0}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
  border-top:1px solid var(--line)}
.pager-btn{background:none;border:1px solid var(--line);color:var(--accent);border-radius:8px;
  padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
.pager-btn:disabled{opacity:.35;cursor:not-allowed}
.pager-label{color:var(--text-2);font-size:12px;text-align:center;flex:1}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="icon.png" alt="">
    <h1>Bilgi Sistemi</h1>
    <p>Personel Bilgi ve Arama Sistemi</p>
  </div>

  <div class="card">
    <label id="searchLabel">TC, AD SOYAD VEYA TELEFON</label>
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="q" type="search" inputmode="search" placeholder="TC, ad soyad veya telefon" autocomplete="off">
    </div>
    <button class="btn" id="searchBtn">Sorgula</button>
    <button class="btn ghost" id="clearAllBtn" style="margin-top:8px">Temizle</button>
    <button class="btn ghost" id="scanBtn" style="margin-top:8px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;margin-right:6px"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      Kart tara (foto)
    </button>
    <input type="file" id="cardInput" accept="image/*" capture="environment">
    <div class="scan-wrap" id="scanWrap"></div>

    <hr class="hr">
    <div class="row-between">
      <button class="upload-link" id="uploadLink">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M3 15v4a2 2 0 002 2h14a2 2 0 002-2v-4"></path></svg>
        Excel / CSV yükle
      </button>
      <span class="count" id="countLabel">0 personel</span>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv,.txt">

    <button class="upload-link" id="addLink" style="margin-top:12px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg>
      Yeni kişi ekle
    </button>
    <div id="addForm" style="display:none;margin-top:12px"></div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div id="progressBar"></div></div>
      <div class="progress-label" id="progressLabel">İşleniyor...</div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="results" id="results"></div>
</div>

<script>
(function(){
  "use strict";

  var DB_NAME = 'bilgi-sistemi-v2';
  var DB_VERSION = 1;
  var STORE = 'records';
  var META = 'meta';
  var BATCH_SIZE = 2000;
  var CHUNK_BYTES = 4 * 1024 * 1024;
  var MAX_RESULTS = 50;

  var els = {
    q: document.getElementById('q'),
    searchBtn: document.getElementById('searchBtn'),
    uploadLink: document.getElementById('uploadLink'),
    addLink: document.getElementById('addLink'),
    addForm: document.getElementById('addForm'),
    scanBtn: document.getElementById('scanBtn'),
    clearAllBtn: document.getElementById('clearAllBtn'),
    cardInput: document.getElementById('cardInput'),
    scanWrap: document.getElementById('scanWrap'),
    fileInput: document.getElementById('fileInput'),
    countLabel: document.getElementById('countLabel'),
    progressWrap: document.getElementById('progressWrap'),
    progressBar: document.getElementById('progressBar'),
    progressLabel: document.getElementById('progressLabel'),
    msg: document.getElementById('msg'),
    results: document.getElementById('results'),
    searchLabel: document.getElementById('searchLabel')
  };

  var memRecords = [];   // [{c:[cell,...], s:'lowercased joined cells'}]
  var headers = [];
  var cols = { tc: -1, name: -1, phone: -1 };
  var db = null;

  // CSV'de "şirket çalışanlarının hepsi" gibi onlarca sütun olsa da, sonuçlarda
  // sadece bu 3 alan gösterilir — arama yine tüm hücrelerde yapılır.
  var ALIASES = {
    tc: ['tc', 'tckn', 'tcno', 'tckimlikno', 'tckimliknumarasi', 'kimlikno'],
    name: ['adsoyad', 'adisoyadi', 'adsoyadi', 'isim', 'ad', 'adi', 'personel', 'personeladi'],
    surname: ['soyad', 'soyadi', 'soyisim'],
    phone: ['telefon', 'tel', 'tlf', 'gsm', 'ceptelefonu', 'cepno', 'cep', 'telefonno'],
    mahalle: ['adresmuhtarlikadi', 'mahalle', 'muhtarlikadi', 'mahalleadi'],
    sokak: ['adrescaddeskadi', 'cadde', 'sokak', 'caddesokakadi', 'caddesk', 'caddeskadi'],
    kapino: ['kapino', 'kapinumarasi', 'kapi'],
    daireno: ['daireno', 'dairenumarasi', 'daire']
  };

  function normalizeHeader(h){
    // Türkçe İ/I/ı/i tutarsızlığı (kaynak CSV'ler genelde ASCII I/i kullanıyor):
    // eşleştirme için ı'yı i'ye katla, böylece "ADI"/"Adı" ikisi de "adi" olur.
    return trLower(String(h || '')).replace(/ı/g, 'i').replace(/[^a-z0-9]/g, '');
  }

  function detectColumns(hdrs){
    var out = { tc: -1, name: -1, surname: -1, phone: -1, mahalle: -1, sokak: -1, kapino: -1, daireno: -1 };
    hdrs.forEach(function(h, i){
      var n = normalizeHeader(h);
      Object.keys(ALIASES).forEach(function(key){
        if (out[key] === -1 && ALIASES[key].indexOf(n) !== -1) out[key] = i;
      });
    });
    // Bilinen başlık yoksa (düzensiz CSV), ilk üç sütunu sırayla varsay.
    if (out.tc === -1 && out.name === -1 && out.phone === -1 && hdrs.length) {
      out.tc = 0; out.name = Math.min(1, hdrs.length - 1); out.phone = Math.min(2, hdrs.length - 1);
    }
    return out;
  }

  function displayName(rec){
    var first = cols.name >= 0 ? (rec.c[cols.name] || '') : '';
    var last = cols.surname >= 0 ? (rec.c[cols.surname] || '') : '';
    return (first + ' ' + last).trim();
  }

  // Aynı mahalle + sokak + kapı no + daire no → aynı ev. Daire boşsa (müstakil
  // ev) yine de gruplanır; mahalle/sokak/kapı boşsa adres bilgisi yetersiz
  // sayılır, gruplanmaz.
  function addressKey(rec){
    if (cols.mahalle < 0 || cols.sokak < 0 || cols.kapino < 0) return null;
    var m = (rec.c[cols.mahalle] || '').trim();
    var s = (rec.c[cols.sokak] || '').trim();
    var k = (rec.c[cols.kapino] || '').trim();
    var d = cols.daireno >= 0 ? (rec.c[cols.daireno] || '').trim() : '';
    if (!m || !s || !k) return null;
    return trLower([m, s, k, d].join('§'));
  }

  function addressLabel(rec){
    var m = cols.mahalle >= 0 ? (rec.c[cols.mahalle] || '') : '';
    var s = cols.sokak >= 0 ? (rec.c[cols.sokak] || '') : '';
    var k = cols.kapino >= 0 ? (rec.c[cols.kapino] || '') : '';
    var d = cols.daireno >= 0 ? (rec.c[cols.daireno] || '') : '';
    var street = [m, s].filter(Boolean).join(' ');
    var no = k ? ('No:' + k + (d ? '/' + d : '')) : '';
    return [street, no].filter(Boolean).join(' ');
  }

  function groupByAddress(list){
    var groups = [];
    var byKey = {};
    list.forEach(function(rec){
      var key = addressKey(rec);
      if (key === null) { groups.push({ key: null, members: [rec] }); return; }
      if (byKey[key]) { byKey[key].members.push(rec); }
      else { var g = { key: key, members: [rec] }; byKey[key] = g; groups.push(g); }
    });
    return groups;
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }

  function setMsg(text, kind){
    els.msg.textContent = text || '';
    els.msg.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function openDb(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var d = req.result;
        if (!d.objectStoreNames.contains(STORE)) {
          d.createObjectStore(STORE, { autoIncrement: true });
        }
        if (!d.objectStoreNames.contains(META)) {
          d.createObjectStore(META);
        }
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbClear(){
    return new Promise(function(resolve, reject){
      var tx = db.transaction([STORE, META], 'readwrite');
      tx.objectStore(STORE).clear();
      tx.objectStore(META).clear();
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbPutMeta(key, val){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(META, 'readwrite');
      tx.objectStore(META).put(val, key);
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbGetMeta(key){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(META, 'readonly');
      var req = tx.objectStore(META).get(key);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbAddBatch(rows){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readwrite');
      var store = tx.objectStore(STORE);
      rows.forEach(function(row){
        var req = store.add(row);
        req.onsuccess = function(){ row._key = req.result; };
      });
      tx.oncomplete = resolve;
      tx.onerror = function(){ reject(tx.error); };
    });
  }

  function idbPutRecord(rec){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readwrite');
      var plain = { c: rec.c, s: rec.s };
      var req = tx.objectStore(STORE).put(plain, rec._key);
      req.onsuccess = resolve;
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbDeleteRecord(key){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readwrite');
      var req = tx.objectStore(STORE).delete(key);
      req.onsuccess = resolve;
      req.onerror = function(){ reject(req.error); };
    });
  }

  function idbLoadAll(){
    return new Promise(function(resolve, reject){
      var tx = db.transaction(STORE, 'readonly');
      var store = tx.objectStore(STORE);
      var valReq = store.getAll();
      var keyReq = store.getAllKeys();
      var vals, keys;
      valReq.onsuccess = function(){ vals = valReq.result; done(); };
      keyReq.onsuccess = function(){ keys = keyReq.result; done(); };
      valReq.onerror = keyReq.onerror = function(e){ reject(e.target.error); };
      function done(){
        if (!vals || !keys) return;
        vals.forEach(function(v, i){ v._key = keys[i]; });
        resolve(vals);
      }
    });
  }

  function trLower(s){
    try { return s.toLocaleLowerCase('tr'); } catch(e) { return s.toLowerCase(); }
  }

  // Arama index'i ve sorgu için: Türkçe dotless ı/dotted i tutarsızlığını
  // katla (klavye/otomatik düzeltme "Yılmaz" yerine "Yilmaz" yazdırabiliyor —
  // trLower ikisini de AYNI karaktere çevirmiyor çünkü ikisi de zaten küçük
  // harf, sadece büyük harften küçülme sırasında İ/I ayrışıyor). Bu yüzden
  // hem kayıt yazılırken hem arama sorgusunda aynı katlama uygulanmalı.
  function foldTr(s){
    return trLower(s).replace(/ı/g, 'i');
  }

  function updateCount(){
    els.countLabel.textContent = memRecords.length.toLocaleString('tr') + ' personel';
  }

  // ---- CSV parsing (quote-aware, single line) ----
  function splitCsvLine(line, delim){
    var cells = [];
    var cur = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQuotes) {
        if (ch === '"') {
          if (line[i+1] === '"') { cur += '"'; i++; }
          else inQuotes = false;
        } else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === delim) { cells.push(cur); cur = ''; }
        else cur += ch;
      }
    }
    cells.push(cur);
    return cells;
  }

  function detectDelimiter(headerLine){
    var commas = (headerLine.match(/,/g) || []).length;
    var semis = (headerLine.match(/;/g) || []).length;
    return semis > commas ? ';' : ',';
  }

  // ---- Import flow ----
  function startImport(file){
    setMsg('');
    els.progressWrap.classList.add('show');
    els.searchBtn.disabled = true;
    els.uploadLink.style.pointerEvents = 'none';

    var decoder = new TextDecoder('utf-8');
    var offset = 0;
    var carry = '';
    var delim = null;
    var gotHeader = false;
    var pendingBatch = [];
    var totalParsed = 0;
    var size = file.size;

    function flushBatch(){
      if (!pendingBatch.length) return Promise.resolve();
      var batch = pendingBatch;
      pendingBatch = [];
      memRecords = memRecords.concat(batch);
      return idbAddBatch(batch);
    }

    function processLine(line){
      if (line === '') return;
      if (!gotHeader) {
        delim = detectDelimiter(line);
        headers = splitCsvLine(line, delim).map(function(h){ return h.trim(); });
        gotHeader = true;
        return;
      }
      var cells = splitCsvLine(line, delim);
      var joined = foldTr(cells.join(' '));
      var rec = { c: cells, s: joined };
      pendingBatch.push(rec);
      totalParsed++;
    }

    function processChunkText(text, isLast){
      carry += text;
      var lines = carry.split(/\r\n|\n|\r/);
      carry = isLast ? '' : lines.pop();
      for (var i = 0; i < lines.length; i++) processLine(lines[i]);
      if (isLast && carry) { processLine(carry); carry = ''; }
    }

    function readNext(){
      if (offset >= size) return finish();
      var slice = file.slice(offset, offset + CHUNK_BYTES);
      var reader = new FileReader();
      reader.onload = function(e){
        offset += CHUNK_BYTES;
        var isLast = offset >= size;
        var text = decoder.decode(e.target.result, { stream: !isLast });
        processChunkText(text, isLast);

        var pct = Math.min(100, Math.round((offset / size) * 100));
        els.progressBar.style.width = pct + '%';
        els.progressLabel.textContent = pct + '% · ' + totalParsed.toLocaleString('tr') + ' satır işlendi';

        var go = function(){ isLast ? finish() : readNext(); };
        if (pendingBatch.length >= BATCH_SIZE) {
          flushBatch().then(function(){
            // yield to the UI thread so iOS doesn't treat this as unresponsive
            setTimeout(go, 0);
          }).catch(function(err){ fail(err); });
        } else {
          setTimeout(go, 0);
        }
      };
      reader.onerror = function(){ fail(reader.error); };
      reader.readAsArrayBuffer(slice);
    }

    function finish(){
      flushBatch().then(function(){
        return idbPutMeta('headers', headers);
      }).then(function(){
        els.progressWrap.classList.remove('show');
        els.searchBtn.disabled = false;
        els.uploadLink.style.pointerEvents = '';
        updateCount();
        updateSearchLabel();
        setMsg(totalParsed.toLocaleString('tr') + ' kayıt yüklendi.', 'ok');
      }).catch(fail);
    }

    function fail(err){
      els.progressWrap.classList.remove('show');
      els.searchBtn.disabled = false;
      els.uploadLink.style.pointerEvents = '';
      setMsg('Hata: ' + (err && err.message ? err.message : err), 'err');
    }

    idbClear().then(function(){
      memRecords = [];
      headers = [];
      readNext();
    }).catch(fail);
  }

  function updateSearchLabel(){
    cols = detectColumns(headers || []);
    els.searchLabel.textContent = 'TC, AD SOYAD VEYA TELEFON';
  }

  function fieldLabels(rec){
    return headers.length ? headers : rec.c.map(function(_, i){ return 'Alan ' + (i + 1); });
  }

  function renderDetailRead(td, tr, rec){
    td.innerHTML = '';
    var dl = document.createElement('dl');
    dl.className = 'detail-grid';
    fieldLabels(rec).forEach(function(h, i){
      var val = rec.c[i];
      if (!val) return;
      var dt = document.createElement('dt'); dt.textContent = h;
      var dd = document.createElement('dd'); dd.textContent = val;
      dl.appendChild(dt); dl.appendChild(dd);
    });
    td.appendChild(dl);

    var actions = document.createElement('div');
    actions.className = 'detail-actions';
    var editBtn = document.createElement('button');
    editBtn.className = 'detail-btn'; editBtn.textContent = 'Düzenle';
    editBtn.addEventListener('click', function(){ renderDetailEdit(td, tr, rec); });
    var delBtn = document.createElement('button');
    delBtn.className = 'detail-btn danger'; delBtn.textContent = 'Sil';
    delBtn.addEventListener('click', function(){
      if (!confirm('Bu kaydı silmek istediğine emin misin?')) return;
      idbDeleteRecord(rec._key).then(function(){
        var idx = memRecords.indexOf(rec);
        if (idx !== -1) memRecords.splice(idx, 1);
        updateCount();
        var detailTr = tr.nextElementSibling;
        if (detailTr && detailTr.classList.contains('detail-row')) detailTr.remove();
        tr.remove();
      }).catch(function(err){ alert('Silinemedi: ' + (err && err.message ? err.message : err)); });
    });
    actions.appendChild(editBtn);
    actions.appendChild(delBtn);
    td.appendChild(actions);
  }

  function renderDetailEdit(td, tr, rec){
    td.innerHTML = '';
    var form = document.createElement('div');
    form.className = 'detail-grid edit';
    var inputs = [];
    fieldLabels(rec).forEach(function(h, i){
      var dt = document.createElement('dt'); dt.textContent = h;
      var input = document.createElement('input');
      input.className = 'detail-input';
      input.value = rec.c[i] || '';
      inputs[i] = input;
      var dd = document.createElement('dd'); dd.appendChild(input);
      form.appendChild(dt); form.appendChild(dd);
    });
    td.appendChild(form);

    var actions = document.createElement('div');
    actions.className = 'detail-actions';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'detail-btn accent'; saveBtn.textContent = 'Kaydet';
    saveBtn.addEventListener('click', function(){
      var newCells = inputs.map(function(inp){ return inp.value.trim(); });
      var oldCells = rec.c;
      rec.c = newCells;
      rec.s = foldTr(newCells.join(' '));
      idbPutRecord(rec).then(function(){
        var vals = [cols.tc >= 0 ? rec.c[cols.tc] : '', displayName(rec), cols.phone >= 0 ? rec.c[cols.phone] : ''];
        Array.prototype.forEach.call(tr.children, function(tdEl, i){ tdEl.textContent = vals[i] || '-'; });
        renderDetailRead(td, tr, rec);
      }).catch(function(err){
        rec.c = oldCells;
        alert('Kaydedilemedi: ' + (err && err.message ? err.message : err));
      });
    });
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'detail-btn'; cancelBtn.textContent = 'İptal';
    cancelBtn.addEventListener('click', function(){ renderDetailRead(td, tr, rec); });
    actions.appendChild(saveBtn);
    actions.appendChild(cancelBtn);
    td.appendChild(actions);
  }

  function toggleDetail(tr, rec){
    var next = tr.nextElementSibling;
    if (next && next.classList.contains('detail-row')) {
      next.remove();
      return;
    }
    var old = tr.parentNode.querySelector('.detail-row');
    if (old) old.remove();

    var detailTr = document.createElement('tr');
    detailTr.className = 'detail-row';
    var td = document.createElement('td');
    td.colSpan = 3;
    renderDetailRead(td, tr, rec);
    detailTr.appendChild(td);
    tr.parentNode.insertBefore(detailTr, tr.nextSibling);
  }

  // ---- Search (sayfalanmış) ----
  var searchState = { pages: [], pageIndex: 0, total: 0 };

  // Grupları MAX_RESULTS kişilik sayfalara böler; bir "aynı evde" grubu
  // sayfa sınırında bölünmez (yarım hane görünmesin diye).
  function paginateGroups(groups){
    var pages = [];
    var cur = [];
    var curCount = 0;
    groups.forEach(function(group){
      if (curCount > 0 && curCount + group.members.length > MAX_RESULTS) {
        pages.push(cur);
        cur = [];
        curCount = 0;
      }
      cur.push(group);
      curCount += group.members.length;
    });
    if (cur.length) pages.push(cur);
    return pages;
  }

  function renderResultsPage(){
    els.results.innerHTML = '';
    var pageGroups = searchState.pages[searchState.pageIndex] || [];
    if (!pageGroups.length) { els.results.innerHTML = '<div class="hint">Eşleşme bulunamadı.</div>'; return; }

    var wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    var table = document.createElement('table');
    table.className = 'rtable';
    var theadRow = document.createElement('tr');
    ['TC Kimlik No', 'Ad Soyad', 'Telefon'].forEach(function(h){
      var th = document.createElement('th'); th.textContent = h; theadRow.appendChild(th);
    });
    var thead = document.createElement('thead');
    thead.appendChild(theadRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    pageGroups.forEach(function(group){
      if (group.members.length > 1) {
        var hdr = document.createElement('tr');
        hdr.className = 'group-row';
        var hdrTd = document.createElement('td');
        hdrTd.colSpan = 3;
        hdrTd.textContent = 'Aynı evde ' + group.members.length + ' kişi · ' + addressLabel(group.members[0]);
        hdr.appendChild(hdrTd);
        tbody.appendChild(hdr);
      }
      group.members.forEach(function(rec){
        var tr = document.createElement('tr');
        if (group.members.length > 1) tr.className = 'grouped';
        [cols.tc >= 0 ? rec.c[cols.tc] : '', displayName(rec), cols.phone >= 0 ? rec.c[cols.phone] : '']
          .forEach(function(val){
            var td = document.createElement('td'); td.textContent = val || '-'; tr.appendChild(td);
          });
        tr.addEventListener('click', function(){ toggleDetail(tr, rec); });
        tbody.appendChild(tr);
      });
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    els.results.appendChild(wrap);

    var totalPages = searchState.pages.length;
    if (totalPages > 1) {
      var pager = document.createElement('div');
      pager.className = 'pager';
      var prev = document.createElement('button');
      prev.className = 'pager-btn'; prev.textContent = '‹ Önceki';
      prev.disabled = searchState.pageIndex === 0;
      prev.addEventListener('click', function(){ searchState.pageIndex--; renderResultsPage(); });
      var label = document.createElement('span');
      label.className = 'pager-label';
      label.textContent = 'Sayfa ' + (searchState.pageIndex + 1) + ' / ' + totalPages +
        ' · ' + searchState.total.toLocaleString('tr') + ' eşleşme';
      var next = document.createElement('button');
      next.className = 'pager-btn'; next.textContent = 'Sonraki ›';
      next.disabled = searchState.pageIndex >= totalPages - 1;
      next.addEventListener('click', function(){ searchState.pageIndex++; renderResultsPage(); });
      pager.appendChild(prev); pager.appendChild(label); pager.appendChild(next);
      els.results.appendChild(pager);
    } else {
      var hint = document.createElement('div');
      hint.className = 'hint';
      hint.textContent = searchState.total.toLocaleString('tr') + ' eşleşme';
      els.results.appendChild(hint);
    }
  }

  function doSearch(){
    var raw = els.q.value.trim();
    els.results.innerHTML = '';
    if (!raw) return;
    var query = foldTr(raw);
    var digits = raw.replace(/\s+/g, '');
    var isDigitQuery = /^\d+$/.test(digits);

    var matches = [];
    for (var i = 0; i < memRecords.length && matches.length < 20000; i++) {
      var rec = memRecords[i];
      var hit = rec.s.indexOf(query) !== -1;
      if (!hit && isDigitQuery) {
        for (var j = 0; j < rec.c.length; j++) {
          if (rec.c[j].replace(/\s+/g, '') === digits) { hit = true; break; }
        }
      }
      if (hit) matches.push(rec);
    }

    showMatches(matches);
  }

  function showMatches(matches){
    if (!matches.length) {
      els.results.innerHTML = '<div class="hint">Eşleşme bulunamadı.</div>';
      return;
    }
    var groups = groupByAddress(matches);
    searchState.pages = paginateGroups(groups);
    searchState.pageIndex = 0;
    searchState.total = matches.length;
    renderResultsPage();
  }

  els.searchBtn.addEventListener('click', doSearch);
  els.clearAllBtn.addEventListener('click', clearScanAndSearch);
  els.q.addEventListener('keydown', function(e){ if (e.key === 'Enter') doSearch(); });
  els.uploadLink.addEventListener('click', function(){ els.fileInput.click(); });
  els.fileInput.addEventListener('change', function(){
    var f = els.fileInput.files && els.fileInput.files[0];
    els.fileInput.value = '';
    if (f) startImport(f);
  });

  function closeAddForm(){
    els.addForm.style.display = 'none';
    els.addForm.innerHTML = '';
  }

  function openAddForm(){
    if (!headers.length) {
      setMsg('Önce bir CSV/Excel yükleyin — sütunlar ondan alınıyor.', 'err');
      return;
    }
    els.addForm.innerHTML = '';
    els.addForm.style.display = 'block';
    var dl = document.createElement('dl');
    dl.className = 'detail-grid edit';
    var inputs = headers.map(function(h){
      var dt = document.createElement('dt'); dt.textContent = h;
      var input = document.createElement('input'); input.className = 'detail-input';
      var dd = document.createElement('dd'); dd.appendChild(input);
      dl.appendChild(dt); dl.appendChild(dd);
      return input;
    });
    els.addForm.appendChild(dl);

    var actions = document.createElement('div');
    actions.className = 'detail-actions';
    var saveBtn = document.createElement('button');
    saveBtn.className = 'detail-btn accent'; saveBtn.textContent = 'Kaydet';
    saveBtn.addEventListener('click', function(){
      var cells = inputs.map(function(inp){ return inp.value.trim(); });
      if (!cells.some(Boolean)) { setMsg('En az bir alan dolu olmalı.', 'err'); return; }
      var rec = { c: cells, s: foldTr(cells.join(' ')) };
      idbAddBatch([rec]).then(function(){
        memRecords.push(rec);
        updateCount();
        closeAddForm();
        setMsg('Kişi eklendi.', 'ok');
      }).catch(function(err){ setMsg('Eklenemedi: ' + (err && err.message ? err.message : err), 'err'); });
    });
    var cancelBtn = document.createElement('button');
    cancelBtn.className = 'detail-btn'; cancelBtn.textContent = 'İptal';
    cancelBtn.addEventListener('click', closeAddForm);
    actions.appendChild(saveBtn); actions.appendChild(cancelBtn);
    els.addForm.appendChild(actions);
  }

  els.addLink.addEventListener('click', function(){
    if (els.addForm.style.display === 'block') closeAddForm();
    else openAddForm();
  });

  // ---- Kart tarama (foto + OCR) ----
  // Tesseract.js: ücretsiz, tarayıcı içinde (WASM) çalışan OCR. İlk taramada
  // motor+dil verisi CDN'den iniyor (~10-15MB, internet gerekir); sonraki
  // taramalarda tarayıcının kendi HTTP cache'i hızlandırır ama bu servis
  // çalışanımızın garanti ettiği "her zaman çevrimdışı" kapsamında DEĞİL —
  // CDN farklı origin olduğu için sw.js bunu önbelleklemiyor.
  var TESSERACT_SRC = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  var tesseractPromise = null;

  function loadTesseract(){
    if (window.Tesseract) return Promise.resolve();
    if (tesseractPromise) return tesseractPromise;
    tesseractPromise = new Promise(function(resolve, reject){
      var s = document.createElement('script');
      s.src = TESSERACT_SRC;
      s.onload = resolve;
      s.onerror = function(){ tesseractPromise = null; reject(new Error('OCR motoru indirilemedi (internet gerekli).')); };
      document.head.appendChild(s);
    });
    return tesseractPromise;
  }

  function resizeForOcr(file, maxDim){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(img.src);
        resolve(canvas);
      };
      img.onerror = function(){ reject(new Error('Fotoğraf okunamadı.')); };
      img.src = URL.createObjectURL(file);
    });
  }

  // Karttaki "AK PARTİ", "PERSONEL KARTI" gibi diğer baskı metninin aramada
  // bir anlamı yok — sadece TC/kart no (öncelik: 11 hane) ve "Adı"/"Soyadı"
  // etiketlerinden birleştirilen tam ad soyad önemli.
  function extractCandidates(text){
    var lines = text.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);

    // Önce "TC" etiketli satırdaki sayıyı tercih et (kartta başka bir 11 haneli
    // sayı — ör. bir reklam/slogan numarası — olsa bile karışmasın).
    var tcLine = lines.find(function(line){ return /\bT\.?C\b/i.test(line) && /\d{4,}/.test(line); });
    var tcNumber = tcLine ? (tcLine.match(/\d{4,}/) || [])[0] : null;

    var numbers = Array.from(new Set((text.match(/\d{4,}/g) || [])));
    var elevenDigit = numbers.find(function(n){ return n.length === 11; });
    var number = tcNumber || elevenDigit || numbers.sort(function(a, b){ return b.length - a.length; })[0] || null;

    // Kimlik kartında etiket ("Soyadı/Surname") bir satırda, büyük siyah
    // değer ("FINDIKLI") ayrı, ALT satırda duruyor. Aynı satırda etiketten
    // sonra anlamlı bir şey yoksa (sadece "/Surname" İngilizce karşılığı
    // kalmışsa), bir sonraki dolu satırı değer kabul et.
    // Sondaki \b bilerek yok: "ı" (Türkçe dotless) bir sonraki "/" veya
    // boşlukla \w/non-\w sınırı oluşturmuyor (JS \w Unicode farkında değil),
    // o yüzden "Soyadı/" gibi bir dizide \b hiç tetiklenmiyordu.
    var SOYADI_LABEL = /\bSOYAD[Iİıi]/i;
    var ADI_LABEL = /\bAD[Iİıi]/i;
    // Noktalama/parantez OCR'da ne şekilde çıkarsa çıksın ("Given Name(s)",
    // "Given Names", "/ Surname" vb.) tüm harf dışı karakterleri atıp
    // karşılaştır — sadece bu İngilizce etiket kalıntısı mı diye bak.
    function isEnglishColabel(s){
      var letters = s.toUpperCase().replace(/[^A-Z]/g, '');
      return letters === 'SURNAME' || letters === 'GIVENNAME' || letters === 'GIVENNAMES';
    }

    function labelValue(labelRe){
      for (var i = 0; i < lines.length; i++) {
        var m = labelRe.exec(lines[i]);
        if (!m) continue;
        var rest = lines[i].slice(m.index + m[0].length).replace(/^[\s:\-\/]+/, '').trim();
        if (rest && !isEnglishColabel(rest)) return rest;
        for (var j = i + 1; j < lines.length; j++) {
          if (!lines[j]) continue;
          if (SOYADI_LABEL.test(lines[j]) || ADI_LABEL.test(lines[j])) break;
          return lines[j];
        }
      }
      return null;
    }

    var soyadi = labelValue(SOYADI_LABEL);
    var adi = labelValue(ADI_LABEL);
    var name = [adi, soyadi].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim() || null;

    return { number: number, name: name };
  }

  function searchByCandidates(number, name){
    var matches = [];
    var nameFold = name ? foldTr(name) : null;
    for (var i = 0; i < memRecords.length; i++) {
      var rec = memRecords[i];
      var score = 0;
      if (number) {
        for (var j = 0; j < rec.c.length; j++) {
          if (rec.c[j].replace(/\s+/g, '') === number) { score += 10; break; }
        }
      }
      if (nameFold && rec.s.indexOf(nameFold) !== -1) score += 5;
      if (score > 0) matches.push({ rec: rec, score: score });
    }
    matches.sort(function(a, b){ return b.score - a.score; });
    return matches.map(function(m){ return m.rec; });
  }

  function clearScanAndSearch(){
    els.scanWrap.innerHTML = '';
    els.q.value = '';
    els.results.innerHTML = '';
    setMsg('');
    searchState = { pages: [], pageIndex: 0, total: 0 };
  }

  function runCardScan(file){
    els.scanWrap.innerHTML = '';
    var status = document.createElement('div');
    status.className = 'msg';
    status.textContent = 'OCR motoru hazırlanıyor...';
    els.scanWrap.appendChild(status);
    els.scanBtn.disabled = true;

    loadTesseract()
      .then(function(){
        status.textContent = 'Fotoğraf hazırlanıyor...';
        return resizeForOcr(file, 1600);
      })
      .then(function(canvas){
        status.textContent = 'Kart okunuyor (ilk seferde dil verisi iniyor, biraz sürebilir)...';
        return Tesseract.recognize(canvas, 'tur');
      })
      .then(function(result){
        var text = result.data.text || '';
        var cand = extractCandidates(text);
        els.scanWrap.innerHTML = '';

        if (cand.number || cand.name) {
          var summary = document.createElement('dl');
          summary.className = 'detail-grid';
          if (cand.name) {
            var dt1 = document.createElement('dt'); dt1.textContent = 'Ad Soyad';
            var dd1 = document.createElement('dd'); dd1.textContent = cand.name;
            summary.appendChild(dt1); summary.appendChild(dd1);
          }
          if (cand.number) {
            var dt2 = document.createElement('dt'); dt2.textContent = 'TC';
            var dd2 = document.createElement('dd'); dd2.textContent = cand.number;
            summary.appendChild(dt2); summary.appendChild(dd2);
          }
          els.scanWrap.appendChild(summary);
        }

        var toggleRaw = document.createElement('button');
        toggleRaw.className = 'upload-link';
        toggleRaw.style.marginTop = '10px';
        toggleRaw.style.fontSize = '12px';
        toggleRaw.textContent = 'Ham okunan metni göster';
        var textBox = document.createElement('div');
        textBox.className = 'scan-text';
        textBox.style.display = 'none';
        textBox.textContent = text.trim() || '(okunamadı)';
        toggleRaw.addEventListener('click', function(){
          var showing = textBox.style.display !== 'none';
          textBox.style.display = showing ? 'none' : 'block';
          toggleRaw.textContent = showing ? 'Ham okunan metni göster' : 'Ham okunan metni gizle';
        });
        els.scanWrap.appendChild(toggleRaw);
        els.scanWrap.appendChild(textBox);

        var clearBtn = document.createElement('button');
        clearBtn.className = 'btn ghost';
        clearBtn.style.marginTop = '10px';
        clearBtn.textContent = 'Temizle';
        clearBtn.addEventListener('click', clearScanAndSearch);
        els.scanWrap.appendChild(clearBtn);

        if (!cand.number && !cand.name) {
          setMsg('Karttan TC/kart no veya ad soyad okunamadı.', 'err');
          return;
        }

        var chips = document.createElement('div');
        chips.className = 'chips';
        [cand.number, cand.name].filter(Boolean).forEach(function(tok){
          var chip = document.createElement('button');
          chip.className = 'chip'; chip.textContent = tok;
          chip.addEventListener('click', function(){ els.q.value = tok; doSearch(); });
          chips.appendChild(chip);
        });
        els.scanWrap.appendChild(chips);

        var found = searchByCandidates(cand.number, cand.name);
        if (found.length) {
          setMsg('Kart bilgileriyle ' + found.length.toLocaleString('tr') + ' eşleşme bulundu.', 'ok');
          showMatches(found);
        } else {
          setMsg('Okunan bilgilerle eşleşme bulunamadı — yukarıdaki değerlerden birine dokunup elle arayabilirsin.', 'err');
        }
      })
      .catch(function(err){
        els.scanWrap.innerHTML = '';
        setMsg('Tarama başarısız: ' + (err && err.message ? err.message : err), 'err');
      })
      .then(function(){
        els.scanBtn.disabled = false;
      });
  }

  els.scanBtn.addEventListener('click', function(){ els.cardInput.click(); });
  els.cardInput.addEventListener('change', function(){
    var f = els.cardInput.files && els.cardInput.files[0];
    els.cardInput.value = '';
    if (f) runCardScan(f);
  });

  els.searchBtn.disabled = true;
  els.uploadLink.style.pointerEvents = 'none';
  setMsg('Kayıtlı veriler yükleniyor...');

  openDb().then(function(d){
    db = d;
    return Promise.all([idbLoadAll(), idbGetMeta('headers')]);
  }).then(function(res){
    var rows = res[0];
    headers = res[1] || [];
    memRecords = rows;
    updateCount();
    updateSearchLabel();
    setMsg('');
  }).catch(function(err){
    setMsg('Veritabanı açılamadı: ' + (err && err.message ? err.message : err), 'err');
  }).then(function(){
    els.searchBtn.disabled = false;
    els.uploadLink.style.pointerEvents = '';
  });
})();
</script>
</body>
