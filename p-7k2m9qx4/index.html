<!DOCTYPE html>
<html lang="tr">
<head>

<!--
  Bu sayfa hiçbir yerden bağlantılı DEĞİL: sitede hiçbir menüde, footer'da,
  blogda veya başka bir sayfada buraya link verilmiyor. sitemap.xml dışında,
  noindex. Gizlilik tahmin edilmesi zor klasör adına + aşağıdaki parolaya
  dayanıyor. Parola kontrolü istemci tarafında (SHA-256 karşılaştırması) —
  görünür kaynak koddan hash'in kendisi okunamaz ama offline brute-force'a
  karşı tek savunma parolanın uzunluğu/rastgeleliği. Gerçek sır burada
  SAKLANMAMALI; sadece erişimi zorlaştırmak için.
-->
<style>
:root{
  color-scheme:dark;
  --bg:#0b0c0f; --surface:#14161b; --line:#262a33;
  --text-1:#f2f3f5; --text-2:#9aa3b2; --text-3:#5b6474;
  --accent:#e9c46a; --bad:#ff6b6b; --ok:#4ade80;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text-1);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.gate{min-height:100svh;display:grid;place-items:center;padding:20px}
.gate form{width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:28px 24px;text-align:center}
.gate .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin:0 auto 18px;
  box-shadow:0 0 12px var(--accent)}
.gate input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
  font:inherit;letter-spacing:.08em;background:#0e0f13;color:var(--text-1);outline:none;
  text-align:center}
.gate input:focus{border-color:var(--accent)}
.gate button{width:100%;margin-top:12px;padding:13px 14px;border:none;border-radius:10px;
  background:var(--accent);color:#1a1405;font:inherit;font-weight:600;cursor:pointer}
.gate button:disabled{opacity:.45;cursor:not-allowed}
.gate .msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--text-2)}
.gate .msg.err{color:var(--bad)}
.content{display:none;max-width:640px;margin:0 auto;padding:48px 20px}
.content.show{display:block}
.content h1{font-size:20px;margin:0 0 12px}
.content p{color:var(--text-2)}
</style>
</head>
<body>

<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="dot"></div>
    <input type="password" id="pw" name="pw" placeholder="Parola" autocomplete="off" autofocus>
    <button type="submit" id="pwBtn">Giriş</button>
    <div class="msg" id="pwMsg"></div>
  </form>
</div>

<div class="content" id="content">
  <h1>İçerik</h1>
  <p>Bu alana henüz içerik eklenmedi.</p>
</div>

<script>
(function(){
  var TARGET_HASH = "8b7bc95bc4dffb6ead6b6cad1fa6d01998f7a5836282b22a724f366ee932559a";
  var SESSION_KEY = "p7k2m9qx4_ok";
  var FAIL_KEY = "p7k2m9qx4_fail";

  var gate = document.getElementById('gate');
  var content = document.getElementById('content');
  var form = document.getElementById('gateForm');
  var input = document.getElementById('pw');
  var btn = document.getElementById('pwBtn');
  var msg = document.getElementById('pwMsg');

  function reveal(){
    gate.style.display = 'none';
    content.classList.add('show');
  }

  try {
    if (sessionStorage.getItem(SESSION_KEY) === '1') { reveal(); }
  } catch(e) {}

  function sha256Hex(str){
    var buf = new TextEncoder().encode(str);
    return crypto.subtle.digest('SHA-256', buf).then(function(hash){
      return Array.prototype.map.call(new Uint8Array(hash), function(b){
        return b.toString(16).padStart(2, '0');
      }).join('');
    });
  }

  function getFails(){
    try { return parseInt(sessionStorage.getItem(FAIL_KEY) || '0', 10); } catch(e){ return 0; }
  }
  function setFails(n){
    try { sessionStorage.setItem(FAIL_KEY, String(n)); } catch(e){}
  }

  function lockFor(seconds){
    btn.disabled = true;
    var remaining = seconds;
    var tick = function(){
      msg.textContent = 'Çok fazla deneme. ' + remaining + ' sn sonra tekrar deneyin.';
      msg.className = 'msg err';
      remaining--;
      if (remaining < 0) {
        clearInterval(timer);
        btn.disabled = false;
        msg.textContent = '';
        msg.className = 'msg';
      }
    };
    tick();
    var timer = setInterval(tick, 1000);
  }

  var fails = getFails();
  if (fails >= 3) {
    var backoff = Math.min(60, 5 * Math.pow(2, fails - 3));
    lockFor(backoff);
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    if (btn.disabled) return;
    var val = input.value;
    btn.disabled = true;
    sha256Hex(val).then(function(hex){
      if (hex === TARGET_HASH) {
        setFails(0);
        try { sessionStorage.setItem(SESSION_KEY, '1'); } catch(e){}
        msg.textContent = '';
        reveal();
      } else {
        var n = getFails() + 1;
        setFails(n);
        input.value = '';
        btn.disabled = false;
        if (n >= 3) {
          lockFor(Math.min(60, 5 * Math.pow(2, n - 3)));
        } else {
          msg.textContent = 'Yanlış parola.';
          msg.className = 'msg err';
        }
      }
    });
  });
})();
</script>

</body>
</html>
