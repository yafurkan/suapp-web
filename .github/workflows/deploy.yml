name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Build girdileri siteye YAYINLANMAZ. GitHub Pages repo kökünü olduğu gibi
      # sunuyor; bu klasörler kalırsa worker/SETUP.md, content/gift/config.json
      # ve scripts/build-gift-pages.py suuapp.com üzerinden okunabilir hale gelir
      # (panel adresi ve kurulum notları dahil). Hiçbiri çalışma anında
      # kullanılmıyor — tamamı yerelde çalışan üretim adımlarının girdisi.
      - name: Yayından build girdilerini çıkar
        run: rm -rf worker scripts content

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
