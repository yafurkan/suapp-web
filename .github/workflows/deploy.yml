name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # github-pages ortamı yalnızca main'den yayına izin veriyor; PR'da bu iş
    # her seferinde ortam korumasına takılıp kırmızı oluyordu. PR'da atlanır.
    if: github.event_name == 'push'
    # Kilit yalnızca yayın işinde: iş akışı düzeyinde olsaydı IndexNow işinin
    # 60 sn beklemesi sıradaki yayını da bekletirdi.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # contents: write — tazelik tarihleri depoya geri yazılır (aşağıda)
    permissions:
      contents: write
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tazelik: bir yazının metni en son hangi commit'te değişti — tam geçmiş gerekir
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Ubuntu 24.04'te sistem Python'una pip kurulamıyor (PEP 668)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # İçeriği ANLAMLI ölçüde değişen blog yazılarının güncelleme tarihi
      # (JSON-LD, article:modified_time, görünür "Güncelleme" satırı, sitemap,
      # blog indeksi) metni değiştiren commit'in tarihine çekilir. İçerik
      # değişmeden tarih ilerlemez; hreflang/analitik/şema gibi toplu
      # enjeksiyonlar sayılmaz. Ayrıntı: scripts/stamp-freshness.py
      - name: Blog tazelik tarihleri
        run: |
          pip install --quiet --disable-pip-version-check jinja2
          python scripts/stamp-freshness.py --apply

      # Kaynak ile yayın aynı kalsın diye sonuç depoya geri yazılır. GITHUB_TOKEN
      # ile yapılan push yeni bir yayın tetiklemez — döngü yok. Push başarısız
      # olsa da yayın bu tarihlerle çıkar; tarih "bugün"den değil commit'ten
      # hesaplandığı için bir sonraki yayın aynı sonucu bulur, kayma olmaz.
      - name: Tarihleri depoya yaz
        continue-on-error: true
        run: |
          if git diff --quiet; then echo "Tarihi değişen yazı yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -q -m "chore(tazelik): içeriği değişen yazıların güncelleme tarihi" \
                        -m "scripts/stamp-freshness.py — yayın akışı, $GITHUB_SHA"
          for i in 1 2 3; do
            if git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::Tarihler depoya yazılamadı; yayın bu tarihlerle çıktı, bir sonraki yayında yeniden hesaplanır."

      # Build girdileri siteye YAYINLANMAZ. GitHub Pages repo kökünü olduğu gibi
      # sunuyor; bu klasörler kalırsa worker/SETUP.md, content/gift/config.json
      # ve scripts/build-gift-pages.py suuapp.com üzerinden okunabilir hale gelir
      # (panel adresi ve kurulum notları dahil). Hiçbiri çalışma anında
      # kullanılmıyor — tamamı yerelde çalışan üretim adımlarının girdisi.
      # README.md ve app-readme.md de geliştirici notu, site sayfası değil:
      # app-readme.md eski iddialar taşıyordu ve suuapp.com/app-readme.md
      # adresinden okunabiliyordu (yapay zekâ tarayıcıları dahil).
      # assets altındaki README'ler de yalnızca dosya yerleşimi notu.
      - name: Yayından build girdilerini çıkar
        run: rm -rf worker scripts content README.md app-readme.md assets/screenshots/README.md assets/special/README.md

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Yayından sonra push'taki TÜM değişen HTML'leri IndexNow'a bildir (Bing,
  # Yandex, Seznam, Naver). Elle `--changed` çalıştırmak unutuluyordu ve o mod
  # yalnızca son commit'e bakıyordu. Gizli anahtar gerekmez — IndexNow anahtar
  # dosyası zaten kökte herkese açık. Ping başarısız olsa da yayın kırmızıya
  # dönmez (continue-on-error).
  indexnow:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read           # son başarılı yayının commit'ini sorgulamak için
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # aralık diff'i için tam geçmiş

      # Aralığın başı github.event.before DEĞİL, son BAŞARILI yayın: art arda
      # iki push'ta bekleyen yayın iptal edilirse (concurrency) o push'un
      # IndexNow işi hiç çalışmaz; bir sonraki push yalnızca kendi commit'lerini
      # bildirseydi iptal edilen push'un sayfaları hiç bildirilmezdi. Bu
      # çalıştırma henüz bitmediği için listede kendisi yer almaz.
      - name: Son başarılı yayın
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
                --event push --status success --limit 1 --json headSha -q '.[0].headSha' || true)
          echo "sha=${sha:-${{ github.event.before }}}" >> "$GITHUB_OUTPUT"

      # Pages dağıtımı CDN'e yayılırken motor sayfayı hemen çekerse eski
      # sürümü görür — kısa bir bekleme.
      - name: Pages yayılımını bekle
        run: sleep 60

      - name: IndexNow'a bildir
        run: python3 scripts/indexnow-submit.py --range "${{ steps.prev.outputs.sha }}..${{ github.sha }}"
