<!doctype html><html lang="tr"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:340px;background:transparent}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.card{position:relative;width:1200px;height:340px;border-radius:28px;overflow:hidden;display:flex;
 background:radial-gradient(circle at 14% 50%,#16314d 0%,#0d1824 38%,#0a1017 70%);border:3px solid #1d3550}
.left{width:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 border-right:2px solid rgba(111,182,245,.18)}
.left img{width:178px;height:178px;filter:drop-shadow(0 0 26px rgba(80,160,255,.45))}
.tag{margin-top:14px;font-size:16px;letter-spacing:2px;color:#9cc9f3;white-space:nowrap;font-weight:600;text-align:center;width:100%;padding-left:2px}
.mid{flex:1;padding:0 0 0 46px;display:flex;flex-direction:column;justify-content:center}
.name{font-size:46px;font-weight:800;color:#fff;letter-spacing:-.5px}
.role{margin-top:6px;font-size:25px;font-weight:600;color:#6FB6F5}
.rows{margin-top:20px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;font-size:23px;color:#dbe7f3}
.chips{position:absolute;left:346px;bottom:22px;display:flex;gap:10px}
.chip{font-size:19px;font-weight:700;color:#fff;padding:7px 15px;border-radius:999px;
 background:rgba(30,136,229,.22);border:1.5px solid rgba(111,182,245,.45)}
.chip.g{background:rgba(46,158,79,.22);border-color:rgba(102,205,132,.5)}
.chip.o{background:rgba(245,124,0,.2);border-color:rgba(255,171,84,.5)}
.right{width:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:linear-gradient(180deg,#1E88E5,#1565C0)}
.qr{background:#fff;border-radius:16px;padding:8px;line-height:0}
.qr svg{width:150px;height:150px}
.dl{margin-top:12px;font-size:20px;font-weight:800;color:#fff;text-align:center;line-height:1.25}
.dl small{display:block;font-size:15px;font-weight:600;color:#d6e9fb}
